<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Distribuidora Campos — Cardápio Digital</title>
<meta name="description" content="Peça bebidas, gelo e petiscos na Distribuidora Campos.">
<meta name="theme-color" content="#121212">
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== HEADER ===================== -->
<header class="header">
  <div class="container header-top">
    <img src="logo.png" alt="Distribuidora Campos" class="logo-img">
    <h1 class="header-boas-vindas">Bem-vindo à Distribuidora Campos!</h1>
    <span id="status-loja" class="status-loja aberta"><span class="status-dot"></span> Loja aberta</span>
  </div>

  <div class="busca-wrap">
    <input type="text" id="busca-input" class="busca-input" placeholder="Buscar produto (ex: Skol, vinho...)" autocomplete="off">
    <span class="busca-icone">🔍</span>
  </div>
</header>

<!-- ===================== NAV CATEGORIAS ===================== -->
<nav class="cat-nav" id="cat-nav" aria-label="Categorias"></nav>

<!-- ===================== PRODUTOS ===================== -->
<main id="categorias-container">
  <div class="loading-full"><div class="spinner"></div><span>Carregando cardápio...</span></div>
</main>

<!-- ===================== CARRINHO FLUTUANTE ===================== -->
<button class="carrinho-flutuante" id="carrinho-flutuante" aria-label="Ver carrinho">
  <span class="carrinho-flutuante-esq"><span class="carrinho-badge" id="carrinho-qtd-badge">0</span> Ver carrinho</span>
  <span class="carrinho-flutuante-dir" id="carrinho-total-badge">R$ 0,00</span>
</button>

<!-- ===================== OVERLAY ===================== -->
<div class="overlay" id="overlay"></div>

<!-- ===================== DRAWER CARRINHO ===================== -->
<section class="drawer" id="drawer-carrinho" aria-label="Carrinho">
  <div class="drawer-handle"></div>
  <div class="drawer-header">
    <h2>Seu carrinho</h2>
    <button class="drawer-fechar" data-fechar-drawer="drawer-carrinho">✕</button>
  </div>
  <div class="drawer-corpo" id="lista-itens-carrinho"></div>
  <div class="drawer-rodape">
    <div class="carrinho-total-linha"><span>Total</span><span id="drawer-total">R$ 0,00</span></div>
    <button class="btn btn-gold btn-block" id="btn-ir-checkout">Continuar pedido</button>
  </div>
</section>

<!-- ===================== DRAWER CHECKOUT ===================== -->
<section class="drawer" id="drawer-checkout" aria-label="Finalizar pedido">
  <div class="drawer-handle"></div>
  <div class="drawer-header">
    <h2>Finalizar pedido</h2>
    <button class="drawer-fechar" data-fechar-drawer="drawer-checkout">✕</button>
  </div>
  <div class="drawer-corpo">
    <form id="form-checkout">
      <div class="campo">
        <label for="cli-nome">Seu nome*</label>
        <input type="text" id="cli-nome" required placeholder="Como podemos te chamar?">
      </div>

      <div class="campo">
        <label>Retirada no balcão*</label>
        <label class="checkbox-confirma" for="confirma-retirada">
          <input type="checkbox" id="confirma-retirada" required>
          <span>Confirmo que vou retirar meu pedido no balcão da loja</span>
        </label>
      </div>

      <div class="campo">
        <label>Forma de pagamento*</label>
        <div class="radio-grupo" id="grupo-pagamento">
          <label class="radio-opcao selecionada"><input type="radio" name="pagamento" value="PIX" checked>PIX</label>
          <label class="radio-opcao"><input type="radio" name="pagamento" value="Cartão">Cartão</label>
          <label class="radio-opcao"><input type="radio" name="pagamento" value="Dinheiro">Dinheiro</label>
        </div>
      </div>

      <div class="campo" id="campo-troco" style="display:none">
        <label for="cli-troco">Troco para quanto?</label>
        <input type="text" id="cli-troco" placeholder="Ex: 50,00 (deixe vazio se não precisar)">
      </div>

      <div class="campo">
        <label for="cli-obs">Observações</label>
        <textarea id="cli-obs" placeholder="Ex: gelo extra, sem embalagem, campainha quebrada..."></textarea>
      </div>

      <div class="carrinho-total-linha"><span>Total do pedido</span><span id="checkout-total">R$ 0,00</span></div>

      <button type="submit" class="btn btn-gold btn-block" id="btn-enviar-pedido">
        <span id="btn-enviar-texto">Enviar pedido pelo WhatsApp</span>
      </button>
    </form>
  </div>
</section>

<div class="toast" id="toast"></div>

<p class="rodape-nota">Distribuidora Campos © 2026 — Cardápio digital</p>

<script type="module" src="app.js"></script>
</body>
</html>
